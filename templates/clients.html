{% extends "base.html" %}
{% block title %}客户管理 - CaseFlow{% endblock %}
{% block content %}
<div class="topbar">
    <div><h2>客户管理</h2><div class="topbar-subtitle">维护客户档案，并快速查看关联案件</div></div>
    <div style="display:flex;gap:8px"><button class="btn btn-outline" onclick="exportClients()">⇩ 导出 Excel</button><button class="btn btn-accent" onclick="openCreate()">＋ 新建客户</button></div>
</div>
<section class="card toolbar">
    <input id="keyword" placeholder="搜索客户名称、电话或邮箱" oninput="loadClients()">
</section>
<section class="card table-card">
    <div id="empty" class="empty" hidden>暂无客户，请先新建客户档案。</div>
    <div class="table-wrap"><table><thead><tr><th>客户名称</th><th>类型</th><th>电话</th><th>邮箱</th><th>操作</th></tr></thead><tbody id="clientRows"></tbody></table></div>
</section>
<dialog id="clientDialog"><form method="dialog" onsubmit="saveClient(event)">
    <h3 id="dialogTitle">新建客户</h3><input type="hidden" id="clientId">
    <label>客户名称<input id="clientName" required placeholder="例如：上海某科技有限公司"></label>
    <label>客户类型<select id="clientType"><option>个人</option><option>企业</option></select></label>
    <label>联系电话<input id="clientPhone"></label>
    <label>邮箱<input id="clientEmail" type="email"></label>
    <div class="dialog-actions"><button type="button" onclick="clientDialog.close()">取消</button><button class="primary">保存</button></div>
</form></dialog>
<dialog id="followupDialog"><form method="dialog" onsubmit="saveFollowup(event)"><h3 id="followupTitle">客户跟进记录</h3><input type="hidden" id="followupClientId"><label>跟进日期<input id="followupDate" type="date" required></label><label>关联案件<select id="followupCase"><option value="">不关联案件</option></select></label><label>沟通方式<select id="followupChannel"><option>电话</option><option>微信</option><option>邮件</option><option>会议</option><option>其他</option></select></label><label>跟进内容<textarea id="followupContent" rows="3" required></textarea></label><label>下一步行动<input id="followupNext" placeholder="例如：下周确认补充材料"></label><div id="followupList" class="followup-list"></div><div class="dialog-actions"><button type="button" onclick="followupDialog.close()">关闭</button><button class="primary">保存跟进</button></div></form></dialog>
<style>
.primary{border:0;border-radius:8px;background:#4f46e5;color:white;padding:11px 16px;cursor:pointer}.toolbar{display:flex;gap:12px;margin-bottom:18px}.toolbar input{flex:1;border:1px solid #ddd;border-radius:8px;padding:11px 12px;font-size:14px}.table-card{overflow:hidden;padding:0}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:16px 20px;border-bottom:1px solid #eee;font-size:14px}th{color:#667085;font-weight:500;background:#f8f9fd}.actions button{border:0;background:transparent;color:#4f46e5;cursor:pointer;margin-right:10px}.actions .danger{color:#c73b3b}.empty{padding:42px;text-align:center;color:#667085}dialog{border:0;border-radius:14px;width:min(560px,calc(100% - 36px));padding:0;box-shadow:0 15px 50px rgba(15,23,42,.22)}dialog::backdrop{background:rgba(30,27,75,.35)}dialog form{padding:26px}dialog h3{margin-top:0}label{display:block;margin:14px 0;font-size:13px;color:#475467}label input,label select,label textarea{box-sizing:border-box;display:block;width:100%;margin-top:6px;border:1px solid #d9deea;border-radius:8px;padding:10px;font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.dialog-actions button{border:1px solid #d9deea;background:white;border-radius:8px;padding:10px 14px;cursor:pointer}.dialog-actions .primary{border:0}.followup-list{border-top:1px solid var(--line);margin-top:16px;max-height:180px;overflow:auto}.followup-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.followup-item strong{font-size:13px}
</style>
<script>
const clientDialog=document.getElementById('clientDialog'), clientRows=document.getElementById('clientRows'), empty=document.getElementById('empty');
async function loadClients(){const response=await fetch('/api/clients?keyword='+encodeURIComponent(document.getElementById('keyword').value));const items=await response.json();empty.hidden=items.length!==0;clientRows.innerHTML=items.map(item=>`<tr><td><strong>${escapeHtml(item.name)}</strong></td><td>${escapeHtml(item.client_type)}</td><td>${escapeHtml(item.phone||'—')}</td><td>${escapeHtml(item.email||'—')}</td><td class="actions"><button onclick="location.href='/cases?client_id=${item.id}'">查看案件</button><button onclick="openFollowups(${item.id},'${escapeJs(item.name)}')">跟进记录</button><button onclick='openEdit(${JSON.stringify(item)})'>编辑</button><button class="danger" onclick="removeClient(${item.id})">删除</button></td></tr>`).join('')}
function openCreate(){document.querySelector('form').reset();document.getElementById('dialogTitle').textContent='新建客户';document.getElementById('clientId').value='';clientDialog.showModal()}
function openEdit(item){document.getElementById('dialogTitle').textContent='编辑客户';clientId.value=item.id;clientName.value=item.name;clientType.value=item.client_type;clientPhone.value=item.phone||'';clientEmail.value=item.email||'';clientDialog.showModal()}
async function saveClient(event){event.preventDefault();const id=clientId.value;const payload={name:clientName.value,client_type:clientType.value,phone:clientPhone.value,email:clientEmail.value};const response=await fetch(id?'/api/clients/'+id:'/api/clients',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)return alert(result.error||'保存失败');clientDialog.close();loadClients()}
async function removeClient(id){if(!confirm('确定要删除这个客户吗？'))return;const response=await fetch('/api/clients/'+id,{method:'DELETE'});if(!response.ok)return alert('删除失败');loadClients()}
async function exportClients(){const items=await(await fetch('/api/clients')).json();const rows=[['客户名称','类型','电话','邮箱'],...items.map(x=>[x.name,x.client_type,x.phone||'',x.email||''])];const csv='\\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='caseflow-clients.csv';a.click();URL.revokeObjectURL(a.href)}
async function openFollowups(clientId,name){followupClientId.value=clientId;followupTitle.textContent=name+' · 客户跟进记录';followupDate.value=new Date().toISOString().slice(0,10);followupContent.value='';followupNext.value='';const cases=await(await fetch('/api/cases?client_id='+clientId)).json();followupCase.innerHTML='<option value="">不关联案件</option>'+cases.map(x=>`<option value="${x.id}">${escapeHtml(x.case_number)} · ${escapeHtml(x.name)}</option>`).join('');await loadFollowups();followupDialog.showModal()}
async function loadFollowups(){const items=await(await fetch('/api/clients/'+followupClientId.value+'/followups')).json();followupList.innerHTML=items.length?items.map(x=>`<div class="followup-item"><strong>${escapeHtml(x.followup_date)} · ${escapeHtml(x.channel)}</strong><br>${escapeHtml(x.content)}<br><span style="color:var(--muted)">${x.next_action?'下一步：'+escapeHtml(x.next_action):''}</span> <button onclick="deleteFollowup(${x.id})" style="float:right;border:0;background:none;color:#d84a4a">删除</button></div>`).join(''):'<div class="followup-item" style="color:var(--muted)">暂无跟进记录</div>'}
async function saveFollowup(e){e.preventDefault();const payload={followup_date:followupDate.value,case_id:followupCase.value,channel:followupChannel.value,content:followupContent.value,next_action:followupNext.value};const response=await fetch('/api/clients/'+followupClientId.value+'/followups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok)return alert('保存失败');followupContent.value='';followupNext.value='';loadFollowups()}
async function deleteFollowup(id){if(!confirm('删除这条跟进记录？'))return;await fetch('/api/client-followups/'+id,{method:'DELETE'});loadFollowups()}
function escapeJs(value){return String(value??'').replaceAll('\\','\\\\').replaceAll("'","\\'")}
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}loadClients();
</script>
{% endblock %}
