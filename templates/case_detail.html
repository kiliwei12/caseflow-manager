{% extends "base.html" %}
{% block title %}案件详情 - CaseFlow{% endblock %}
{% block content %}
<div class="topbar"><div><a href="/cases">← 返回案件列表</a><h2 id="caseName">案件详情</h2></div><span id="caseStatus" class="status">加载中</span></div>
<section class="card case-summary"><div><small>案号</small><strong id="caseNumber">—</strong></div><div><small>案件类型</small><strong id="caseType">—</strong></div><div><small>客户</small><strong id="clientName">未关联</strong></div><div><small>关键日期</small><strong id="deadline">—</strong></div><div><small>风险等级</small><strong id="riskLevel">—</strong></div><div><small>健康度</small><strong id="healthScore">—</strong></div><div><small>负责人</small><strong id="ownerName">—</strong></div><div><small>标签</small><strong id="caseTags">—</strong></div></section>
<section class="card detail-tabs"><button class="btn btn-outline active" onclick="showDetailTab('timeline',this)">◷ 时间线</button><button class="btn btn-outline" onclick="showDetailTab('workrecords',this)">✎ 工作记录</button><button class="btn btn-outline" onclick="showDetailTab('todos',this)">✓ 待办事项</button><button class="btn btn-outline" onclick="showDetailTab('documents',this)">▤ 文档</button><button class="btn btn-outline" onclick="showDetailTab('summons',this)">▧ 传票</button><button class="btn btn-outline" onclick="showDetailTab('followups',this)">☏ 跟进记录</button></section>
<section class="card timeline-card"><div class="section-heading"><h3>案件时间线</h3><button class="primary" onclick="openCreate()">+ 添加事件</button></div><div id="timelineList" class="timeline-list"></div><div id="empty" class="empty" hidden>还没有时间线事件。</div></section>
<section id="workPanel" class="card" hidden>
    <div class="section-heading"><div><h3>工作记录</h3><div class="work-summary">累计工时 <strong id="workTotal">0</strong> 小时 · <span id="workCount">0</span> 条记录</div></div><button class="btn btn-accent" onclick="openWorkCreate()">＋ 添加记录</button></div>
    <div id="workList" class="work-list"></div>
</section>
<section id="detailPlaceholder" class="card" hidden><h3 id="placeholderTitle"></h3><p id="placeholderCopy" style="color:var(--muted);line-height:1.8"></p><a id="placeholderLink" class="btn btn-outline" href="/todos">打开相关模块</a></section>
<dialog id="timelineDialog"><form method="dialog" onsubmit="saveEvent(event)"><h3>添加时间线事件</h3><label>事件日期<input id="eventDate" type="date" required></label><label>事件标题<input id="eventTitle" required placeholder="例如：提交起诉材料"></label><label>事件类型<select id="eventType"><option>立案</option><option>沟通</option><option>开庭</option><option>判决</option><option>执行</option><option>其他</option></select></label><label>事件描述<textarea id="eventDescription" rows="4"></textarea></label><div class="dialog-actions"><button type="button" onclick="timelineDialog.close()">取消</button><button class="primary">保存</button></div></form></dialog>
<dialog id="workDialog"><form id="workForm" onsubmit="saveWork(event)"><h3 id="workDialogTitle">添加工作记录</h3><input type="hidden" id="workId"><label>工作日期<input id="workDate" type="date" required></label><label>工作类别<select id="workCategory"><option>出庭</option><option>阅卷</option><option>起草</option><option>沟通</option><option>调研</option><option>其他</option></select></label><label>工作内容<textarea id="workContent" rows="3" required maxlength="1000" placeholder="记录本次为案件完成的工作"></textarea></label><label>工时（小时）<input id="workHours" type="number" min="0.25" max="24" step="0.25" required placeholder="例如 1.5"></label><div class="dialog-actions"><button type="button" class="btn btn-outline" onclick="workDialog.close()">取消</button><button type="submit" class="btn btn-accent">保存</button></div></form></dialog>
<style>
.topbar{align-items:flex-start}.topbar h2{margin-top:10px}.topbar a{color:#4f46e5;text-decoration:none;font-size:14px}.status{border-radius:999px;padding:7px 12px;background:#eef2ff;color:#4338ca}.case-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:20px}.case-summary small{display:block;color:#667085;margin-bottom:8px}.case-summary strong{display:block;font-size:16px}.section-heading{display:flex;justify-content:space-between;align-items:center}.section-heading h3{margin:0}.primary{border:0;border-radius:8px;background:#4f46e5;color:white;padding:10px 14px;cursor:pointer}.timeline-list{margin-top:22px}.timeline-item{position:relative;padding:0 0 24px 28px;border-left:2px solid #c7d2fe;margin-left:8px}.timeline-item:last-child{border-left-color:transparent}.timeline-item::before{content:'';position:absolute;left:-7px;top:0;width:12px;height:12px;border-radius:50%;background:#4f46e5}.timeline-date{font-size:13px;color:#4f46e5;font-weight:600}.timeline-title{font-size:16px;font-weight:600;margin:5px 0}.timeline-desc{color:#667085;line-height:1.6}.event-type{font-size:12px;background:#eef2ff;color:#4338ca;padding:4px 8px;border-radius:999px;margin-left:8px}.empty{text-align:center;color:#667085;padding:40px}dialog{border:0;border-radius:14px;width:min(500px,calc(100% - 36px));padding:0;box-shadow:0 15px 50px rgba(15,23,42,.22)}dialog::backdrop{background:rgba(30,27,75,.35)}dialog form{padding:26px}dialog h3{margin-top:0}label{display:block;margin:14px 0;font-size:13px;color:#475467}label input,label select,label textarea{box-sizing:border-box;display:block;width:100%;margin-top:6px;border:1px solid #d9deea;border-radius:8px;padding:10px;font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.dialog-actions button{border:1px solid #d9deea;background:white;border-radius:8px;padding:10px 14px;cursor:pointer}.dialog-actions .primary{border:0}@media(max-width:760px){.case-summary{grid-template-columns:repeat(2,1fr)}}
.detail-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:20px}.detail-tabs .active{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
.detail-action-groups{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}.detail-action-groups .btn{font-size:12px}
.work-summary{color:var(--muted);font-size:13px;margin-top:6px}.work-summary strong{color:var(--primary-dark)}.work-list{margin-top:18px}.work-item{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding:16px 0;border-top:1px solid var(--line)}.work-item:first-child{border-top:0}.work-heading{font-size:14px;font-weight:700}.work-meta{color:var(--muted);font-size:12px;margin-top:6px}.work-actions{display:flex;gap:7px;flex-shrink:0}.work-actions button{border:1px solid var(--border);border-radius:8px;background:#fff;padding:6px 10px;cursor:pointer;color:var(--primary-dark)}.work-actions .danger{color:#b42318}.work-empty{color:var(--muted);padding:28px 0;text-align:center}
</style>
<script>
const caseId={{ case_id }},timelineDialog=document.getElementById('timelineDialog');
async function loadCase(){const response=await fetch('/api/cases/'+caseId);if(!response.ok){document.getElementById('caseName').textContent='案件不存在';return}const x=await response.json();document.getElementById('caseName').textContent=x.name;document.getElementById('caseNumber').textContent=x.case_number;document.getElementById('caseType').textContent=x.case_type;document.getElementById('clientName').textContent=x.client_name||'未关联';document.getElementById('deadline').textContent=(x.deadline_kind||'关键日期')+' · '+(x.deadline||'—');document.getElementById('caseStatus').textContent=x.status;document.getElementById('riskLevel').textContent=(x.risk_level||'中')+'风险';document.getElementById('healthScore').textContent=x.health_score+' · '+x.health_label;document.getElementById('ownerName').textContent=x.owner_name||'未分配';document.getElementById('caseTags').textContent=x.tags||'—'}
async function loadTimeline(){const items=await(await fetch('/api/cases/'+caseId+'/timeline')).json();document.getElementById('empty').hidden=items.length!==0;document.getElementById('timelineList').innerHTML=items.map(x=>`<div class="timeline-item"><div><span class="timeline-date">${x.event_date}</span><span class="event-type">${escapeHtml(x.event_type)}</span></div><div class="timeline-title">${escapeHtml(x.title)}</div><div class="timeline-desc">${escapeHtml(x.description||'')}</div><button onclick="removeEvent(${x.id})" style="border:0;background:none;color:#c73b3b;cursor:pointer;padding:0">删除</button></div>`).join('')}
function openCreate(){document.querySelector('form').reset();eventDate.value=new Date().toISOString().slice(0,10);timelineDialog.showModal()}
function showDetailTab(tab,button){
    document.querySelectorAll('.detail-tabs .btn').forEach(x=>x.classList.remove('active'));button.classList.add('active');
    document.querySelector('.timeline-card').hidden=tab!=='timeline';
    document.getElementById('workPanel').hidden=tab!=='workrecords';
    const placeholder=document.getElementById('detailPlaceholder');placeholder.hidden=!['todos','documents','summons','followups'].includes(tab);
    if(tab==='workrecords'){loadWorkRecords();return}
    if(!placeholder.hidden){
        const settings={todos:['待办事项','案件待办已可在待办中心关联、编辑与完成。','/todos','进入待办中心'],documents:['文档','文档上传与预览尚未开放，请勿在此处存放真实案件材料。','/install','查看本地安装说明'],summons:['传票','传票上传与提醒尚未开放；关键开庭日期可在编辑案件时设置。','/cases','编辑案件关键日期'],followups:['跟进记录','客户跟进已可在客户管理页面记录沟通和下一步行动。','/clients','进入客户管理']}[tab];
        document.getElementById('placeholderTitle').textContent=settings[0];document.getElementById('placeholderCopy').textContent=settings[1];document.getElementById('placeholderLink').href=settings[2];document.getElementById('placeholderLink').textContent=settings[3];
    }
}
const workDialog=document.getElementById('workDialog');let workRecordCache=new Map();
async function loadWorkRecords(){
    const response=await fetch(`/api/cases/${caseId}/work-records`);if(!response.ok)return;
    const data=await response.json();workRecordCache=new Map(data.records.map(record=>[record.id,record]));
    document.getElementById('workTotal').textContent=data.total_hours;document.getElementById('workCount').textContent=data.records.length;
    document.getElementById('workList').innerHTML=data.records.length?data.records.map(record=>`<article class="work-item"><div><div class="work-heading">${escapeHtml(record.content)}</div><div class="work-meta">${escapeHtml(record.work_date)} · ${escapeHtml(record.category)} · ${record.hours} 小时</div></div><div class="work-actions"><button type="button" onclick="openWorkEdit(${record.id})">编辑</button><button type="button" class="danger" onclick="deleteWork(${record.id})">删除</button></div></article>`).join(''):'<div class="work-empty">暂无工作记录。点击“添加记录”开始记录案件工时。</div>';
}
function openWorkCreate(){
    document.getElementById('workForm').reset();document.getElementById('workId').value='';document.getElementById('workDialogTitle').textContent='添加工作记录';
    document.getElementById('workDate').value=new Date().toLocaleDateString('en-CA');workDialog.showModal();
}
function openWorkEdit(id){
    const record=workRecordCache.get(id);if(!record)return;
    document.getElementById('workDialogTitle').textContent='编辑工作记录';document.getElementById('workId').value=id;
    document.getElementById('workDate').value=record.work_date;document.getElementById('workCategory').value=record.category;
    document.getElementById('workContent').value=record.content;document.getElementById('workHours').value=record.hours;workDialog.showModal();
}
async function saveWork(event){
    event.preventDefault();const id=document.getElementById('workId').value;
    const payload={work_date:document.getElementById('workDate').value,category:document.getElementById('workCategory').value,content:document.getElementById('workContent').value,hours:document.getElementById('workHours').value};
    const path=`/api/cases/${caseId}/work-records`+(id?`/${id}`:'');
    const response=await fetch(path,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!response.ok){const result=await response.json();alert(result.error||'保存失败');return}
    workDialog.close();await loadWorkRecords();
}
async function deleteWork(id){
    if(!confirm('确定删除这条工作记录吗？'))return;
    const response=await fetch(`/api/cases/${caseId}/work-records/${id}`,{method:'DELETE'});
    if(!response.ok){alert('删除失败');return}await loadWorkRecords();
}
async function saveEvent(e){e.preventDefault();const response=await fetch('/api/cases/'+caseId+'/timeline',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_date:eventDate.value,title:eventTitle.value,event_type:eventType.value,description:eventDescription.value})});const result=await response.json();if(!response.ok)return alert(result.error||'保存失败');timelineDialog.close();loadTimeline()}
async function removeEvent(id){if(!confirm('确定要删除这个时间线事件吗？'))return;await fetch('/api/timeline/'+id,{method:'DELETE'});loadTimeline()}
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}loadCase();loadTimeline();
</script>
{% endblock %}
