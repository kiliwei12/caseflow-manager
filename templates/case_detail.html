{% extends "base.html" %}
{% block title %}案件详情 - CaseFlow{% endblock %}
{% block content %}
<div class="topbar"><div><a href="/cases">← 返回案件列表</a><h2 id="caseName">案件详情</h2></div><span id="caseStatus" class="status">加载中</span></div>
<section class="card case-summary"><div><small>案号</small><strong id="caseNumber">—</strong></div><div><small>案件类型</small><strong id="caseType">—</strong></div><div><small>客户</small><strong id="clientName">未关联</strong></div><div><small>下一节点</small><strong id="deadline">—</strong></div></section>
<section class="card timeline-card"><div class="section-heading"><h3>案件时间线</h3><button class="primary" onclick="openCreate()">+ 添加事件</button></div><div id="timelineList" class="timeline-list"></div><div id="empty" class="empty" hidden>还没有时间线事件。</div></section>
<dialog id="timelineDialog"><form method="dialog" onsubmit="saveEvent(event)"><h3>添加时间线事件</h3><label>事件日期<input id="eventDate" type="date" required></label><label>事件标题<input id="eventTitle" required placeholder="例如：提交起诉材料"></label><label>事件类型<select id="eventType"><option>立案</option><option>沟通</option><option>开庭</option><option>判决</option><option>执行</option><option>其他</option></select></label><label>事件描述<textarea id="eventDescription" rows="4"></textarea></label><div class="dialog-actions"><button type="button" onclick="timelineDialog.close()">取消</button><button class="primary">保存</button></div></form></dialog>
<style>
.topbar{align-items:flex-start}.topbar h2{margin-top:10px}.topbar a{color:#6c328b;text-decoration:none;font-size:14px}.status{border-radius:999px;padding:7px 12px;background:#e8dafa;color:#5d2384}.case-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:20px}.case-summary small{display:block;color:#777;margin-bottom:8px}.case-summary strong{display:block;font-size:16px}.section-heading{display:flex;justify-content:space-between;align-items:center}.section-heading h3{margin:0}.primary{border:0;border-radius:8px;background:#7f37a2;color:white;padding:10px 14px;cursor:pointer}.timeline-list{margin-top:22px}.timeline-item{position:relative;padding:0 0 24px 28px;border-left:2px solid #dac7e8;margin-left:8px}.timeline-item:last-child{border-left-color:transparent}.timeline-item::before{content:'';position:absolute;left:-7px;top:0;width:12px;height:12px;border-radius:50%;background:#7f37a2}.timeline-date{font-size:13px;color:#7f37a2;font-weight:600}.timeline-title{font-size:16px;font-weight:600;margin:5px 0}.timeline-desc{color:#666;line-height:1.6}.event-type{font-size:12px;background:#f0eaf5;padding:4px 8px;border-radius:999px;margin-left:8px}.empty{text-align:center;color:#777;padding:40px}dialog{border:0;border-radius:14px;width:min(500px,calc(100% - 36px));padding:0;box-shadow:0 15px 50px rgba(0,0,0,.22)}dialog::backdrop{background:rgba(32,18,45,.35)}dialog form{padding:26px}dialog h3{margin-top:0}label{display:block;margin:14px 0;font-size:13px;color:#555}label input,label select,label textarea{box-sizing:border-box;display:block;width:100%;margin-top:6px;border:1px solid #ddd;border-radius:8px;padding:10px;font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.dialog-actions button{border:1px solid #ddd;background:white;border-radius:8px;padding:10px 14px;cursor:pointer}.dialog-actions .primary{border:0}@media(max-width:760px){.case-summary{grid-template-columns:repeat(2,1fr)}}
</style>
<script>
const caseId={{ case_id }},timelineDialog=document.getElementById('timelineDialog');
async function loadCase(){const response=await fetch('/api/cases/'+caseId);if(!response.ok){document.getElementById('caseName').textContent='案件不存在';return}const x=await response.json();document.getElementById('caseName').textContent=x.name;document.getElementById('caseNumber').textContent=x.case_number;document.getElementById('caseType').textContent=x.case_type;document.getElementById('clientName').textContent=x.client_name||'未关联';document.getElementById('deadline').textContent=x.deadline||'—';document.getElementById('caseStatus').textContent=x.status}
async function loadTimeline(){const items=await(await fetch('/api/cases/'+caseId+'/timeline')).json();document.getElementById('empty').hidden=items.length!==0;document.getElementById('timelineList').innerHTML=items.map(x=>`<div class="timeline-item"><div><span class="timeline-date">${x.event_date}</span><span class="event-type">${escapeHtml(x.event_type)}</span></div><div class="timeline-title">${escapeHtml(x.title)}</div><div class="timeline-desc">${escapeHtml(x.description||'')}</div><button onclick="removeEvent(${x.id})" style="border:0;background:none;color:#c73b3b;cursor:pointer;padding:0">删除</button></div>`).join('')}
function openCreate(){document.querySelector('form').reset();eventDate.value=new Date().toISOString().slice(0,10);timelineDialog.showModal()}
async function saveEvent(e){e.preventDefault();const response=await fetch('/api/cases/'+caseId+'/timeline',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_date:eventDate.value,title:eventTitle.value,event_type:eventType.value,description:eventDescription.value})});const result=await response.json();if(!response.ok)return alert(result.error||'保存失败');timelineDialog.close();loadTimeline()}
async function removeEvent(id){if(!confirm('确定要删除这个时间线事件吗？'))return;await fetch('/api/timeline/'+id,{method:'DELETE'});loadTimeline()}
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}loadCase();loadTimeline();
</script>
{% endblock %}
