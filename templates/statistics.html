{% extends "base.html" %}
{% block title %}数据看板 - CaseFlow{% endblock %}
{% block content %}
<div class="topbar"><h2>数据看板</h2><span class="badge">实时统计</span></div>
<div class="cards"><section class="card"><small>案件总数</small><div class="metric" id="totalCases">—</div></section><section class="card"><small>客户总数</small><div class="metric" id="totalClients">—</div></section><section class="card"><small>未完成待办</small><div class="metric" id="openTodos">—</div></section><section class="card"><small>已完成待办</small><div class="metric" id="completedTodos">—</div></section></div>
<div class="grid"><section class="card"><h3>案件状态分布</h3><div id="statusList"></div></section><section class="card"><h3>案件类型分布</h3><div id="typeList"></div></section><section class="card"><h3>未完成待办优先级</h3><div id="priorityList"></div></section></div>
<style>
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}.grid h3{margin-top:0;font-size:17px}.bar-row{margin:18px 0}.bar-label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.bar-track{height:9px;background:#eee8f3;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:#7f37a2;border-radius:99px}.no-data{color:#888;padding:20px 0}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
<script>
function renderBars(targetId,items){const target=document.getElementById(targetId);if(!items.length){target.innerHTML='<div class="no-data">暂无数据</div>';return}const max=Math.max(...items.map(x=>x.value));target.innerHTML=items.map(x=>`<div class="bar-row"><div class="bar-label"><span>${escapeHtml(x.label)}</span><strong>${x.value}</strong></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(8,x.value/max*100)}%"></div></div></div>`).join('')}
async function loadStats(){const x=await(await fetch('/api/statistics')).json();totalCases.textContent=x.total_cases;totalClients.textContent=x.total_clients;openTodos.textContent=x.open_todos;completedTodos.textContent=x.completed_todos;renderBars('statusList',x.cases_by_status);renderBars('typeList',x.cases_by_type);renderBars('priorityList',x.todos_by_priority)}function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}loadStats();
</script>
{% endblock %}
