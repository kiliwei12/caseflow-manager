{% extends "base.html" %}
{% block title %}数据看板 - CaseFlow{% endblock %}
{% block content %}
<div class="topbar"><div><h2>数据看板</h2><div class="topbar-subtitle">案件健康度、风险分布与关键日期预警</div></div><span class="badge">实时统计</span></div>
<div class="cards"><section class="card"><small>案件总数</small><div class="metric" id="totalCases">—</div></section><section class="card"><small>客户总数</small><div class="metric" id="totalClients">—</div></section><section class="card"><small>未完成待办</small><div class="metric" id="openTodos">—</div></section><section class="card"><small>已完成待办</small><div class="metric" id="completedTodos">—</div></section></div>
<div class="grid"><section class="card"><h3>案件状态分布</h3><div id="statusList"></div></section><section class="card"><h3>案件类型分布</h3><div id="typeList"></div></section><section class="card"><h3>风险等级分布</h3><div id="riskList"></div></section></div>
<div class="grid lower-grid"><section class="card deadline-card"><div class="section-heading"><h3>未来 14 天关键日期</h3><a class="btn btn-outline" href="/cases">查看案件</a></div><div id="deadlineList"></div></section><section class="card"><div class="section-heading"><h3>最近操作</h3><a class="btn btn-outline" href="/activity-log">全部日志</a></div><div id="recentLogList"></div></section></div>
<style>
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}.grid h3{margin-top:0;font-size:17px}.bar-row{margin:18px 0}.bar-label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.bar-track{height:9px;background:#e8eaf5;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:var(--primary);border-radius:99px}.no-data{color:#667085;padding:20px 0}.lower-grid{grid-template-columns:1.15fr .85fr}.deadline-row,.recent-log{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.deadline-row:last-child,.recent-log:last-child{border-bottom:0}.deadline-date{color:var(--primary-pressed);font-weight:700}.risk-pill{float:right;padding:3px 7px;border-radius:99px;font-size:11px}.risk-pill.高{background:#fee2e2;color:#b91c1c}.risk-pill.中{background:#fff3c4;color:#854d0e}.risk-pill.低{background:#dcfce7;color:#166534}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
<script>
function renderBars(targetId,items){const target=document.getElementById(targetId);if(!items.length){target.innerHTML='<div class="no-data">暂无数据</div>';return}const max=Math.max(...items.map(x=>x.value));target.innerHTML=items.map(x=>`<div class="bar-row"><div class="bar-label"><span>${escapeHtml(x.label)}</span><strong>${x.value}</strong></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(8,x.value/max*100)}%"></div></div></div>`).join('')}
function renderDeadlines(items){deadlineList.innerHTML=items.length?items.map(x=>`<div class="deadline-row"><span class="deadline-date">${x.deadline}</span> · <a href="/cases/${x.id}">${escapeHtml(x.name)}</a><span class="risk-pill ${escapeHtml(x.risk_level)}">${escapeHtml(x.risk_level)}风险</span><div style="color:var(--muted);margin-top:4px">${escapeHtml(x.deadline_kind||'关键节点')} · ${escapeHtml(x.case_number)}</div></div>`).join(''):'<div class="no-data">未来 14 天暂无关键日期</div>'}function renderLogs(items){recentLogList.innerHTML=items.length?items.map(x=>`<div class="recent-log"><strong>${escapeHtml(x.action)}</strong> · ${escapeHtml(x.detail)}<div style="color:var(--muted);margin-top:4px">${escapeHtml(x.created_at)}</div></div>`).join(''):'<div class="no-data">暂无操作记录</div>'}async function loadStats(){const x=await(await fetch('/api/statistics')).json();totalCases.textContent=x.total_cases;totalClients.textContent=x.total_clients;openTodos.textContent=x.open_todos;completedTodos.textContent=x.completed_todos;renderBars('statusList',x.cases_by_status);renderBars('typeList',x.cases_by_type);renderBars('riskList',x.risk_distribution);renderDeadlines(x.upcoming_deadlines);renderLogs(x.recent_logs)}function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}loadStats();
</script>
{% endblock %}
