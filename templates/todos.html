{% extends "base.html" %}
{% block title %}待办事项 - CaseFlow{% endblock %}
{% block content %}
<div class="topbar"><div><h2>待办事项</h2><div class="topbar-subtitle">按优先级和截止日期管理每日工作</div></div><button class="btn btn-accent" onclick="openCreate()">＋ 新建待办</button></div>
<section class="card toolbar"><div class="filter-buttons"><button class="btn btn-outline active" onclick="filterTodos('',this)">全部</button><button class="btn btn-outline" onclick="filterTodos('待办',this)">待办</button><button class="btn btn-outline" onclick="filterTodos('进行中',this)">进行中</button><button class="btn btn-outline" onclick="filterTodos('已完成',this)">已完成</button></div><select id="statusFilter" onchange="loadTodos()" hidden><option value="">全部状态</option><option>待办</option><option>进行中</option><option>已完成</option></select></section>
<section class="card table-card"><div id="empty" class="empty" hidden>暂无待办事项。</div><div class="table-wrap"><table><thead><tr><th>待办事项</th><th>关联案件</th><th>优先级</th><th>截止日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="todoRows"></tbody></table></div></section>
<dialog id="todoDialog"><form method="dialog" onsubmit="saveTodo(event)"><h3 id="dialogTitle">新建待办</h3><input type="hidden" id="todoId">
<label>待办标题<input id="todoTitle" required placeholder="例如：准备开庭材料"></label>
<label>关联案件<select id="todoCase"><option value="">不关联案件</option></select></label>
<label>优先级<select id="todoPriority"><option>普通</option><option>重要</option><option>紧急</option></select></label>
<label>截止日期<input id="todoDeadline" type="date"></label>
<label>状态<select id="todoStatus"><option>待办</option><option>进行中</option><option>已完成</option></select></label>
<div class="dialog-actions"><button type="button" onclick="todoDialog.close()">取消</button><button class="primary">保存</button></div></form></dialog>
<style>
.primary{border:0;border-radius:8px;background:#4f46e5;color:white;padding:11px 16px;cursor:pointer}.toolbar{display:flex;gap:12px;margin-bottom:18px}.toolbar select{border:1px solid #d9deea;border-radius:8px;padding:11px 12px;font-size:14px}.table-card{overflow:hidden;padding:0}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:780px}th,td{text-align:left;padding:16px 20px;border-bottom:1px solid #eee;font-size:14px}th{color:#667085;font-weight:500;background:#f8f9fd}.priority{border-radius:999px;padding:5px 10px}.priority.紧急{background:#ffe1e1;color:#b32727}.priority.重要{background:#fff0c2;color:#896500}.priority.普通{background:#eef2f6;color:#667085}.status{border-radius:999px;padding:5px 10px;background:#eef2ff;color:#4338ca}.actions button{border:0;background:transparent;color:#4f46e5;cursor:pointer;margin-right:10px}.actions .danger{color:#c73b3b}.empty{padding:42px;text-align:center;color:#667085}dialog{border:0;border-radius:14px;width:min(500px,calc(100% - 36px));padding:0;box-shadow:0 15px 50px rgba(15,23,42,.22)}dialog::backdrop{background:rgba(30,27,75,.35)}dialog form{padding:26px}dialog h3{margin-top:0}label{display:block;margin:14px 0;font-size:13px;color:#475467}label input,label select{box-sizing:border-box;display:block;width:100%;margin-top:6px;border:1px solid #d9deea;border-radius:8px;padding:10px;font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.dialog-actions button{border:1px solid #d9deea;background:white;border-radius:8px;padding:10px 14px;cursor:pointer}.dialog-actions .primary{border:0}
.filter-buttons{display:flex;gap:7px}.filter-buttons .active{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
</style>
<script>
const todoDialog=document.getElementById('todoDialog'),todoRows=document.getElementById('todoRows'),empty=document.getElementById('empty');let caseOptions=[];
async function loadCases(){caseOptions=await (await fetch('/api/cases/options')).json();todoCase.innerHTML='<option value="">不关联案件</option>'+caseOptions.map(x=>`<option value="${x.id}">${escapeHtml(x.case_number)} · ${escapeHtml(x.name)}</option>`).join('')}
async function loadTodos(){const response=await fetch('/api/todos?status='+encodeURIComponent(statusFilter.value));const items=await response.json();empty.hidden=items.length!==0;todoRows.innerHTML=items.map(x=>`<tr><td>${escapeHtml(x.title)}</td><td>${escapeHtml(x.case_name||'—')}</td><td><span class="priority ${escapeHtml(x.priority)}">${escapeHtml(x.priority)}</span></td><td>${x.deadline||'—'}</td><td><span class="status">${escapeHtml(x.status)}</span></td><td class="actions">${x.status!=='已完成'?`<button onclick="completeTodo(${x.id})" title="标记完成">✓</button>`:''}<button onclick='openEdit(${JSON.stringify(x)})'>编辑</button><button class="danger" onclick="removeTodo(${x.id})">删除</button></td></tr>`).join('')}
function openCreate(){document.querySelector('form').reset();document.getElementById('dialogTitle').textContent='新建待办';document.getElementById('todoId').value='';todoDialog.showModal()}
function openEdit(x){document.getElementById('dialogTitle').textContent='编辑待办';todoId.value=x.id;todoTitle.value=x.title;todoCase.value=x.case_id||'';todoPriority.value=x.priority;todoDeadline.value=x.deadline||'';todoStatus.value=x.status;todoDialog.showModal()}
async function saveTodo(e){e.preventDefault();const id=todoId.value,payload={title:todoTitle.value,case_id:todoCase.value,priority:todoPriority.value,deadline:todoDeadline.value,status:todoStatus.value};const response=await fetch(id?'/api/todos/'+id:'/api/todos',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)return alert(result.error||'保存失败');todoDialog.close();loadTodos()}
async function removeTodo(id){if(!confirm('确定要删除这个待办吗？'))return;const response=await fetch('/api/todos/'+id,{method:'DELETE'});if(!response.ok)return alert('删除失败');loadTodos()}
async function completeTodo(id){const item=(await (await fetch('/api/todos')).json()).find(x=>x.id===id);if(!item)return;await fetch('/api/todos/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...item,status:'已完成'})});loadTodos()}
function filterTodos(status,button){document.querySelectorAll('.filter-buttons .btn').forEach(x=>x.classList.remove('active'));button.classList.add('active');document.getElementById('statusFilter').value=status;loadTodos()}
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}loadCases().then(loadTodos);
</script>
{% endblock %}
