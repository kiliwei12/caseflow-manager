{% extends "base.html" %}
{% block title %}文书模板 - CaseFlow{% endblock %}
{% block content %}
<div class="topbar">
    <div><h2>文书模板</h2><div class="topbar-subtitle">保存常用文本或小体积 Word/PDF 文件，形成可复用模板库</div></div>
    <div class="template-toolbar"><button class="btn btn-outline danger" id="batchDeleteBtn" hidden onclick="batchDeleteTemplates()">删除选中（<span id="selectedCount">0</span>）</button><button class="btn btn-accent" onclick="openTemplateCreate()">＋ 新建模板</button></div>
</div>

<section class="card template-filters">
    <button class="btn btn-outline active" onclick="filterTemplates('',this)">全部</button><button class="btn btn-outline" onclick="filterTemplates('起诉状',this)">起诉状</button><button class="btn btn-outline" onclick="filterTemplates('答辩状',this)">答辩状</button><button class="btn btn-outline" onclick="filterTemplates('律师函',this)">律师函</button><button class="btn btn-outline" onclick="filterTemplates('合同',this)">合同</button><button class="btn btn-outline" onclick="filterTemplates('常用法院文书',this)">常用法院文书</button><button class="btn btn-outline" onclick="filterTemplates('备忘录',this)">备忘录</button>
</section>

<section class="template-grid" id="templateCards"></section>
<div id="templateEmpty" class="card empty-state" hidden>当前分类暂无模板。点击“新建模板”添加第一份。</div>

<dialog id="templateDialog"><form id="templateForm" onsubmit="saveTemplate(event)"><h3 id="templateDialogTitle">新建文书模板</h3><input type="hidden" id="templateId"><label>模板名称<input id="templateName" required maxlength="100" placeholder="例如：民事起诉状"></label><label>模板分类<select id="templateCategory"><option>起诉状</option><option>答辩状</option><option>律师函</option><option>合同</option><option>常用法院文书</option><option>备忘录</option></select></label><label>使用说明<textarea id="templateDescription" rows="2" maxlength="500" placeholder="适用场景、填写注意事项"></textarea></label><label>模板正文<textarea id="templateContent" rows="8" maxlength="20000" placeholder="可填写文本模板，支持使用 {客户名称} 等占位符"></textarea></label><label>附件（可选，PDF / DOCX，最大 2MB）<input id="templateFile" type="file" accept=".docx,.pdf,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label><label id="existingFileRow" class="existing-file" hidden><input id="removeTemplateFile" type="checkbox"> 删除现有附件 <span id="existingFileName"></span></label><div class="dialog-actions"><button type="button" class="btn btn-outline" onclick="templateDialog.close()">取消</button><button class="btn btn-accent">保存</button></div></form></dialog>

<dialog id="viewDialog"><div class="view-dialog"><div class="section-heading"><h3 id="viewName"></h3><button class="btn btn-outline" onclick="viewDialog.close()">关闭</button></div><div class="view-meta" id="viewMeta"></div><p id="viewDescription"></p><pre id="viewContent"></pre><a id="viewDownload" class="btn btn-accent" href="#">下载模板</a></div></dialog>

<style>
.template-toolbar{display:flex;gap:8px}.template-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.template-filters .active{background:var(--primary-soft);color:var(--primary-pressed);border-color:var(--primary)}.template-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.template-card{position:relative;display:flex;flex-direction:column;min-height:220px}.template-select{position:absolute;right:18px;top:18px;width:18px;height:18px}.template-category{display:inline-block;width:max-content;padding:5px 9px;border-radius:99px;background:var(--teal);color:var(--teal-ink);font-size:12px;font-weight:700}.template-card h3{font-size:18px;margin:18px 30px 8px 0}.template-card p{color:var(--muted);line-height:1.55;margin:0;flex:1}.template-file{font-size:12px;color:var(--primary-dark);margin:12px 0}.template-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.template-actions .btn{padding:7px 10px}.danger{color:#b42318!important}.empty-state{text-align:center;color:var(--muted);padding:55px}dialog{border:0;border-radius:16px;width:min(650px,calc(100% - 32px));padding:0;box-shadow:0 20px 60px rgba(15,23,42,.22)}dialog::backdrop{background:rgba(30,27,75,.35)}dialog form,.view-dialog{padding:26px}dialog h3{margin-top:0}dialog label{display:block;margin:14px 0;font-size:13px;color:#475467}dialog input:not([type=checkbox]),dialog select,dialog textarea{box-sizing:border-box;display:block;width:100%;margin-top:6px;border:1px solid #d9deea;border-radius:8px;padding:10px;font:inherit}.existing-file{display:flex;gap:8px;align-items:center}.view-meta{color:var(--muted);font-size:13px;margin:10px 0}.view-dialog p{line-height:1.65}.view-dialog pre{white-space:pre-wrap;background:#f6f7f9;border-radius:10px;padding:16px;max-height:360px;overflow:auto;font:14px/1.65 ui-monospace,monospace}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}@media(max-width:950px){.template-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.template-grid{grid-template-columns:1fr}.topbar{align-items:stretch}.template-toolbar{flex-wrap:wrap}}
</style>

<script>
const templateDialog=document.getElementById('templateDialog'),viewDialog=document.getElementById('viewDialog');let templates=[],currentCategory='',selectedIds=new Set();
async function loadTemplates(){const response=await fetch('/api/templates'+(currentCategory?'?category='+encodeURIComponent(currentCategory):''));templates=await response.json();selectedIds=new Set([...selectedIds].filter(id=>templates.some(item=>item.id===id)));renderTemplates()}
function renderTemplates(){const cards=document.getElementById('templateCards');document.getElementById('templateEmpty').hidden=templates.length!==0;cards.innerHTML=templates.map(item=>`<article class="card template-card"><input class="template-select" type="checkbox" ${selectedIds.has(item.id)?'checked':''} onchange="toggleSelection(${item.id},this.checked)" aria-label="选择 ${escapeHtml(item.name)}"><span class="template-category">${escapeHtml(item.category)}</span><h3>${escapeHtml(item.name)}</h3><p>${escapeHtml(item.description||'暂无使用说明')}</p>${item.file_name?`<div class="template-file">附件：${escapeHtml(item.file_name)}</div>`:''}<div class="template-actions"><button class="btn btn-outline" onclick="viewTemplate(${item.id})">查看</button><button class="btn btn-outline" onclick="openTemplateEdit(${item.id})">编辑</button><a class="btn btn-outline" href="/api/templates/${item.id}/download">下载</a><button class="btn btn-outline danger" onclick="deleteTemplate(${item.id})">删除</button></div></article>`).join('');updateBatchButton()}
function filterTemplates(category,button){currentCategory=category;document.querySelectorAll('.template-filters .btn').forEach(item=>item.classList.remove('active'));button.classList.add('active');loadTemplates()}
function toggleSelection(id,checked){checked?selectedIds.add(id):selectedIds.delete(id);updateBatchButton()}
function updateBatchButton(){document.getElementById('selectedCount').textContent=selectedIds.size;document.getElementById('batchDeleteBtn').hidden=selectedIds.size===0}
function resetTemplateForm(){document.getElementById('templateForm').reset();document.getElementById('templateId').value='';document.getElementById('existingFileRow').hidden=true;document.getElementById('existingFileName').textContent='';document.getElementById('removeTemplateFile').checked=false}
function openTemplateCreate(){resetTemplateForm();document.getElementById('templateDialogTitle').textContent='新建文书模板';if(currentCategory)document.getElementById('templateCategory').value=currentCategory;templateDialog.showModal()}
function openTemplateEdit(id){const item=templates.find(value=>value.id===id);if(!item)return;resetTemplateForm();document.getElementById('templateDialogTitle').textContent='编辑文书模板';document.getElementById('templateId').value=id;document.getElementById('templateName').value=item.name;document.getElementById('templateCategory').value=item.category;document.getElementById('templateDescription').value=item.description||'';document.getElementById('templateContent').value=item.content||'';if(item.file_name){document.getElementById('existingFileRow').hidden=false;document.getElementById('existingFileName').textContent='（'+item.file_name+'）'}templateDialog.showModal()}
function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',',2)[1]);reader.onerror=reject;reader.readAsDataURL(file)})}
async function saveTemplate(event){event.preventDefault();const file=document.getElementById('templateFile').files[0];if(file&&file.size>2*1024*1024)return alert('模板文件不能超过 2MB');const payload={name:document.getElementById('templateName').value,category:document.getElementById('templateCategory').value,description:document.getElementById('templateDescription').value,content:document.getElementById('templateContent').value,remove_file:document.getElementById('removeTemplateFile').checked};if(file){payload.file_name=file.name;payload.file_mime=file.type;payload.file_data=await readFile(file)}const id=document.getElementById('templateId').value;const response=await fetch(id?'/api/templates/'+id:'/api/templates',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)return alert(result.error||'保存失败');templateDialog.close();loadTemplates()}
function viewTemplate(id){const item=templates.find(value=>value.id===id);if(!item)return;document.getElementById('viewName').textContent=item.name;document.getElementById('viewMeta').textContent=item.category+(item.file_name?' · '+item.file_name:'');document.getElementById('viewDescription').textContent=item.description||'暂无使用说明';document.getElementById('viewContent').textContent=item.content||'暂无文本正文';document.getElementById('viewDownload').href='/api/templates/'+id+'/download';viewDialog.showModal()}
async function deleteTemplate(id){if(!confirm('确定删除这个模板吗？'))return;const response=await fetch('/api/templates/'+id,{method:'DELETE'});if(!response.ok)return alert('删除失败');selectedIds.delete(id);loadTemplates()}
async function batchDeleteTemplates(){if(!selectedIds.size||!confirm(`确定删除选中的 ${selectedIds.size} 个模板吗？`))return;const response=await fetch('/api/templates/batch-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...selectedIds]})});const result=await response.json();if(!response.ok)return alert(result.error||'批量删除失败');selectedIds.clear();loadTemplates()}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}loadTemplates();
</script>
{% endblock %}
