<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CaseFlow 案件管理平台{% endblock %}</title>
    <style>
        :root { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; --ink:#172033; --muted:#667085; --line:#e6eaf2; --primary:#4f46e5; --primary-dark:#3730a3; --violet:#7c3aed; --soft:#eef2ff; }
        * { box-sizing: border-box; }
        body { margin: 0; background: radial-gradient(circle at 85% -10%, #e9e7ff 0, #f5f7fb 34%, #f5f7fb 100%); }
        .layout { min-height: 100vh; display: grid; grid-template-columns: 248px 1fr; }
        aside { background: linear-gradient(180deg, #24205b 0%, #312e81 52%, #4338ca 100%); color: white; padding: 28px 18px; box-shadow: 12px 0 35px rgba(49,46,129,.12); }
        aside h1 { font-size: 23px; letter-spacing: -.03em; margin: 0 0 6px; }
        aside p { color: #c7d2fe; font-size: 12px; margin: 0 0 34px; }
        .brand-mark { display:inline-grid; place-items:center; width:34px; height:34px; margin-right:8px; border-radius:10px; background:linear-gradient(135deg,#a78bfa,#6366f1); vertical-align:middle; font-weight:800; }
        nav a { display: flex; align-items:center; gap:9px; color: #e0e7ff; text-decoration: none; padding: 12px 13px; border-radius: 10px; margin-bottom: 7px; font-size:14px; transition: .18s ease; }
        nav a.active, nav a:hover { background: rgba(255,255,255,.16); color: white; transform: translateX(2px); }
        main { padding: 38px 42px; max-width: 1320px; width: 100%; box-sizing: border-box; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .topbar h2 { margin: 0; font-size: 30px; letter-spacing: -.035em; color: var(--ink); }
        .badge { background: var(--soft); color: var(--primary-dark); border:1px solid #dfe3ff; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight:600; }
        .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .card { background: rgba(255,255,255,.92); border:1px solid rgba(230,234,242,.9); border-radius: 16px; padding: 24px; box-shadow: 0 10px 28px rgba(30,41,59,.06); }
        .card small { color: var(--muted); font-size: 12px; font-weight:600; letter-spacing:.02em; }
        .metric { font-size: 38px; font-weight: 750; color: var(--primary-dark); margin-top: 12px; letter-spacing:-.04em; }
        .intro { margin-top: 22px; line-height: 1.7; color: #475467; }
        button.primary, .primary { background: linear-gradient(135deg, var(--primary), var(--violet)) !important; box-shadow: 0 8px 16px rgba(79,70,229,.2); transition: transform .18s ease, box-shadow .18s ease; }
        button.primary:hover, .primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(79,70,229,.3); }
        input:focus, select:focus, textarea:focus { outline:none; border-color:#818cf8 !important; box-shadow:0 0 0 3px rgba(129,140,248,.18); }
        table th { color:#667085 !important; background:#f8f9fd !important; }
        table td { color:#344054; }
        a { color: var(--primary-dark); }
        @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } aside { padding: 20px; } nav { display: flex; gap: 6px; overflow-x: auto; } nav a { white-space: nowrap; } main { padding: 24px 18px; } .cards { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="layout">
    <aside>
        <h1><span class="brand-mark">C</span>CaseFlow</h1>
        <p>案件全生命周期管理平台</p>
        <nav>
            <a class="{% if request.path == '/' %}active{% endif %}" href="/">系统概览</a>
            <a class="{% if request.path.startswith('/cases') %}active{% endif %}" href="/cases">案件管理</a>
            <a class="{% if request.path.startswith('/clients') %}active{% endif %}" href="/clients">客户管理</a>
            <a class="{% if request.path.startswith('/todos') %}active{% endif %}" href="/todos">待办事项</a>
            <a class="{% if request.path.startswith('/statistics') %}active{% endif %}" href="/statistics">数据看板</a>
        </nav>
    </aside>
    <main>{% block content %}{% endblock %}</main>
</div>
</body>
</html>
