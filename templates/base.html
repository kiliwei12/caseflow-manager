<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CaseFlow 案件管理平台{% endblock %}</title>
    <style>
        :root {
            font-family: "Noto Sans", Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1c1c1e; background: #ffffff;
            --ink:#1c1c1e; --muted:#555a6a; --placeholder:#a5a8b5; --line:#e0e2e8; --border:#c7cad5;
            --primary:#5b76fe; --primary-pressed:#2a41b6; --primary-dark:#2a41b6; --primary-soft:#e5eaff;
            --coral:#ffc6c6; --coral-ink:#600000; --rose:#ffd8f4; --teal:#c3faf5; --teal-ink:#187574;
            --orange:#ffe6cd; --yellow:#fff0a8; --moss:#dceac8; --success:#00b473; --danger:#d84a4a;
            --ring:rgb(224,226,232) 0 0 0 1px;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background:#ffffff; }
        .layout { min-height: 100vh; display: grid; grid-template-columns: 256px 1fr; }
        aside { background:#ffffff; color:var(--ink); padding:18px 14px; box-shadow:inset -1px 0 0 var(--line); display:flex; flex-direction:column; }
        aside h1 { font-family:"Arial Rounded MT Bold", "Noto Sans", sans-serif; font-size:22px; letter-spacing:-.06em; margin:0 0 5px; }
        aside p { color:var(--muted); font-size:12px; margin:0 0 29px; padding-left:7px; }
        .brand-mark { display:inline-grid; place-items:center; width:36px; height:36px; margin-right:8px; border-radius:10px; background:var(--yellow); color:var(--ink); vertical-align:middle; font-weight:900; box-shadow:var(--ring); }
        nav { display:flex; flex-direction:column; gap:3px; }
        nav a { display:flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none; padding:11px 12px; border-radius:10px; margin-bottom:2px; font-size:14px; font-weight:600; transition:background .16s ease, transform .16s ease; }
        nav a .nav-icon { width:23px; height:23px; display:grid; place-items:center; border-radius:7px; background:#f4f5f8; font-size:12px; color:#3f4654; }
        nav a.active, nav a:hover { background:var(--primary-soft); color:var(--primary-pressed); transform:translateX(2px); }
        nav a.active .nav-icon { background:var(--primary); color:#fff; }
        .sidebar-footer { margin-top:auto; border-top:1px solid var(--line); padding:16px 8px 2px; color:var(--muted); font-size:11px; line-height:1.6; }
        main { padding:30px 42px 48px; max-width:1440px; width:100%; box-sizing:border-box; background:linear-gradient(135deg,#fff 0%,#fff 68%,#f9faff 100%); }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .topbar h2 { font-family:"Arial Rounded MT Bold", "Noto Sans", sans-serif; margin:0; font-size:30px; font-weight:700; letter-spacing:-.055em; color:var(--ink); }
        .topbar-subtitle { color:var(--muted); font-size:13px; margin-top:6px; }
        .badge { background:var(--teal); color:var(--teal-ink); border:0; border-radius:999px; padding:7px 12px; font-size:13px; font-weight:700; }
        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
        .card { background:#fff; border:0; border-radius:16px; padding:22px; box-shadow:var(--ring); }
        .card small { color: var(--muted); font-size: 12px; font-weight:600; letter-spacing:.02em; }
        .metric { font-family:"Arial Rounded MT Bold", "Noto Sans", sans-serif; font-size:38px; font-weight:700; color:var(--ink); margin-top:10px; letter-spacing:-.06em; }
        .intro { margin-top: 22px; line-height: 1.7; color: #475467; }
        button.primary, .primary { background:var(--primary)!important; box-shadow:none!important; transition:transform .16s ease, background .16s ease; }
        button.primary:hover, .primary:hover { transform:translateY(-1px); background:var(--primary-pressed)!important; box-shadow:none!important; }
        input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary)!important; box-shadow:0 0 0 3px rgba(91,118,254,.18); }
        table th { color:var(--muted)!important; background:#fafafa!important; }
        table td { color:var(--ink); }
        a { color:var(--primary-pressed); }
        .clickable { cursor:pointer; transition:transform .18s ease, box-shadow .18s ease; }
        .clickable:hover { transform:translateY(-2px); box-shadow:0 0 0 2px var(--primary),0 6px 0 rgba(91,118,254,.12); }
        .section-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .section-heading h3 { margin:0; font-size:16px; }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:8px; border:1px solid transparent; padding:9px 13px; cursor:pointer; font:inherit; font-size:13px; font-weight:700; text-decoration:none; transition:transform .16s ease,background .16s ease; }
        .btn:hover { transform:translateY(-1px); }
        .btn-accent { background:var(--primary); color:#fff; box-shadow:none; }.btn-accent:hover{background:var(--primary-pressed)}
        .btn-outline { background:#fff; color:var(--ink); border-color:var(--border); }.btn-outline:hover{background:var(--primary-soft);border-color:var(--primary)}
        .btn-ghost { background:transparent; color:var(--ink); }
        @media (max-width: 920px) { .cards { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } aside { padding: 18px; } nav { display: flex; flex-direction:row; gap: 6px; overflow-x: auto; } nav a { white-space: nowrap; } .sidebar-footer { display:none; } main { padding: 24px 18px; } .cards { grid-template-columns: 1fr 1fr; } .topbar { align-items:flex-start; gap:14px; } }
        @media (max-width: 480px) { .cards { grid-template-columns: 1fr; } .topbar { flex-direction:column; } }
    </style>
</head>
<body>
<div class="layout">
    <aside>
        <h1><span class="brand-mark">C</span>CaseFlow</h1>
        <p>案件全生命周期管理平台</p>
        <nav>
            <a class="{% if request.path == '/' %}active{% endif %}" href="/" onclick="location.href='/'"><span class="nav-icon">⌂</span><span>系统首页</span></a>
            <a class="{% if request.path.startswith('/cases') %}active{% endif %}" href="/cases" onclick="location.href='/cases'"><span class="nav-icon">▣</span><span>案件管理</span></a>
            <a class="{% if request.path.startswith('/clients') %}active{% endif %}" href="/clients" onclick="location.href='/clients'"><span class="nav-icon">♙</span><span>客户管理</span></a>
            <a class="{% if request.path.startswith('/todos') %}active{% endif %}" href="/todos" onclick="location.href='/todos'"><span class="nav-icon">✓</span><span>待办事项</span></a>
            <a class="{% if request.path.startswith('/templates') %}active{% endif %}" href="/templates" onclick="location.href='/templates'"><span class="nav-icon">▤</span><span>文书模板</span></a>
            <a class="{% if request.path.startswith('/statistics') %}active{% endif %}" href="/statistics" onclick="location.href='/statistics'"><span class="nav-icon">▥</span><span>数据统计</span></a>
            <a class="{% if request.path.startswith('/activity-log') %}active{% endif %}" href="/activity-log" onclick="location.href='/activity-log'"><span class="nav-icon">◷</span><span>操作日志</span></a>
        </nav>
        <div class="sidebar-footer">🔒 数据不上云 · 隐私优先<br>CaseFlow Product Portfolio<br>案件全生命周期管理平台</div>
    </aside>
    <main>{% block content %}{% endblock %}</main>
</div>
{% block extra_js %}{% endblock %}
</body>
</html>
