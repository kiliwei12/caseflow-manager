<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CaseFlow 案件管理平台{% endblock %}</title>
    <style>
        :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202124; background: #f6f7fb; }
        body { margin: 0; }
        .layout { min-height: 100vh; display: grid; grid-template-columns: 220px 1fr; }
        aside { background: #3f1d63; color: white; padding: 28px 18px; }
        aside h1 { font-size: 22px; margin: 0 0 6px; }
        aside p { color: #d9c9e8; font-size: 12px; margin: 0 0 36px; }
        nav a { display: block; color: #eee6f7; text-decoration: none; padding: 12px; border-radius: 8px; margin-bottom: 6px; }
        nav a.active, nav a:hover { background: #7f37a2; }
        main { padding: 36px; max-width: 1180px; width: 100%; box-sizing: border-box; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .topbar h2 { margin: 0; font-size: 28px; }
        .badge { background: #e8dafa; color: #5d2384; border-radius: 999px; padding: 7px 12px; font-size: 13px; }
        .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .card { background: white; border-radius: 14px; padding: 24px; box-shadow: 0 4px 18px rgba(52, 36, 71, .07); }
        .card small { color: #777; }
        .metric { font-size: 36px; font-weight: 700; color: #5d2384; margin-top: 12px; }
        .intro { margin-top: 22px; line-height: 1.7; color: #555; }
        @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } aside { padding: 20px; } nav { display: flex; gap: 6px; overflow-x: auto; } nav a { white-space: nowrap; } main { padding: 22px; } .cards { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="layout">
    <aside>
        <h1>CaseFlow</h1>
        <p>案件全生命周期管理平台</p>
        <nav>
            <a class="active" href="/">系统概览</a>
            <a href="/cases">案件管理</a>
            <a href="/clients">客户管理</a>
            <a href="/todos">待办事项</a>
            <a href="/statistics">数据看板</a>
        </nav>
    </aside>
    <main>{% block content %}{% endblock %}</main>
</div>
</body>
</html>
