{% extends "base.html" %}
{% block title %}操作日志 - CaseFlow{% endblock %}
{% block content %}
<div class="topbar"><div><h2>操作日志</h2><div class="topbar-subtitle">记录案件、客户、待办及跟进的关键操作</div></div><span class="badge">审计追踪</span></div>
<section class="card"><div id="logList" class="log-list"><p style="color:var(--muted)">正在加载日志…</p></div></section>
<style>.log-row{display:grid;grid-template-columns:110px 130px 1fr 165px;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);align-items:center;font-size:14px}.log-row:last-child{border-bottom:0}.log-action{font-weight:700}.log-type{display:inline-block;background:var(--primary-soft);color:var(--primary-pressed);padding:4px 8px;border-radius:99px;width:max-content;font-size:12px}.log-time{font-size:12px;color:var(--muted)}@media(max-width:720px){.log-row{grid-template-columns:1fr 1fr}.log-row .log-detail{grid-column:1/-1}}</style>
<script>
async function loadLogs(){const logs=await(await fetch('/api/activity-logs')).json();document.getElementById('logList').innerHTML=logs.length?logs.map(x=>`<div class="log-row"><span class="log-type">${escapeHtml(x.entity_type)}</span><span class="log-action">${escapeHtml(x.action)}</span><span class="log-detail">${escapeHtml(x.detail)}</span><span class="log-time">${escapeHtml(x.created_at)}</span></div>`).join(''):'<p style="color:var(--muted)">暂无操作日志</p>'}function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}loadLogs();
</script>
{% endblock %}
